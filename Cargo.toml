[package]
name = "html-to-pdf-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
chromiumoxide = { version = "0.5", features = ["tokio-runtime"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
dotenv = "0.15"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
url = "2.5"
regex = "1.11"
thiserror = "1.0"
