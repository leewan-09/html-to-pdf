[package]
name = "html-to-pdf-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.4"
chromiumoxide = { version = "0.7", features = ["tokio-runtime"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-util = { version = "0.7.16", features = ["time"] }
dotenv = "0.15"
tower = "0.4"
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
futures-util = "0.3.31"
url = "2.5.4"
regex = "1.11.1"
thiserror = "2.0.14"
once_cell = "1.21.3"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
