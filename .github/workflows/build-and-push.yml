name: Build and Push Docker Image
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: leewan98
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: leewan98/html-to-pdf:latest
          cache-from: type=registry,ref=leewan98/html-to-pdf:buildcache
          cache-to: type=registry,ref=leewan98/html-to-pdf:buildcache,mode=max
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          password: ${{ secrets.SSH_SECRET }}
          script: |
            cd apps
            docker compose pull pdf_service
            docker compose down pdf_service
            docker compose up -d pdf_service
            docker system prune -f
